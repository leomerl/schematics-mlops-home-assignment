{{- $root := . }}
{{- $serving := .Values.serving }}
{{- range $slot := list "champion" "challenger" }}
{{- $app := index $serving $slot }}
{{- $isChampion := eq $slot "champion" }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $app.name }}
  labels:
    {{- include "bl-ranker.labels" (dict "name" $app.name) | nindent 4 }}
spec:
  replicas: {{ $app.replicas }}
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ $app.name }}
  template:
    metadata:
      labels:
        {{- include "bl-ranker.labels" (dict "name" $app.name) | nindent 8 }}
    spec:
      terminationGracePeriodSeconds: {{ $serving.terminationGracePeriodSeconds }}
      {{- include "bl-ranker.podSecurity" $root | nindent 6 }}
      containers:
        - name: api
          {{- include "bl-ranker.image" $root | nindent 10 }}
          command: [uvicorn, "serving.app:app", --host=0.0.0.0, "--port={{ $serving.port }}"]
          env:
            {{- include "bl-ranker.registryEnv" $root | nindent 12 }}
            - name: MODEL_ALIAS
              value: {{ $app.alias | quote }}
            - name: MODEL_VERSION
              value: {{ index $root.Values.models $slot | default "" | quote }}
            - name: WEB_CONCURRENCY
              value: "1"
            {{- include "bl-ranker.secretEnv" (dict "root" $root "key" "TABPFN_TOKEN") | nindent 12 }}
            {{- if $isChampion }}
            - name: SHADOW_URL
              value: "http://{{ $serving.challenger.name }}:{{ $serving.port }}"
            - name: SHADOW_SAMPLE_RATE
              value: {{ $serving.shadowSampleRate | quote }}
            - name: SHADOW_LOG_PATH
              value: /shadow/shadow_log.jsonl
            {{- end }}
          ports:
            - name: http
              containerPort: {{ $serving.port }}
          startupProbe:
            httpGet: {path: /health, port: http}
            periodSeconds: 5
            failureThreshold: {{ div $serving.startupTimeoutSeconds 5 }}
          readinessProbe:
            httpGet: {path: /health, port: http}
            periodSeconds: 5
            failureThreshold: 2
          livenessProbe:
            httpGet: {path: /health, port: http}
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
          lifecycle:
            preStop:
              sleep:
                seconds: {{ $serving.preStopSleepSeconds }}
          resources:
            {{- toYaml $serving.resources | nindent 12 }}
          {{- if $isChampion }}
          volumeMounts:
            - name: shadow
              mountPath: /shadow
          {{- end }}
      {{- if $isChampion }}
      volumes:
        - name: shadow
          persistentVolumeClaim:
            claimName: shadow-data
      {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $app.name }}
spec:
  selector:
    app.kubernetes.io/name: {{ $app.name }}
  ports:
    - name: http
      port: {{ $serving.port }}
      targetPort: http
{{- if gt (int $app.replicas) 1 }}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ $app.name }}
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ $app.name }}
{{- end }}
{{- end }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: shadow-data
  annotations:
    argocd.argoproj.io/sync-options: Delete=false
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: {{ .Values.shadow.storage }}
