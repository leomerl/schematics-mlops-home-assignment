[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "bl-ranker"
version = "0.1.0"
requires-python = ">=3.12"
dynamic = ["dependencies"]

[project.scripts]
bl-train = "databricks_job:main"

[tool.setuptools]
packages = ["ranker", "researcher", "serving", "training", "utils"]
py-modules = ["databricks_job"]

[tool.setuptools.dynamic]
dependencies = { file = ["deps.txt"] }
